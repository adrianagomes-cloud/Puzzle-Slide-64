name: puzzle_slide_64
description: "Un juego de rompecabezas deslizante estilo arcade retro."
publish_to: 'none' # Evita la publicación accidental en pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Declaración de carpetas de recursos (imágenes y sonidos)
  assets:
    - lib/assets/
    - lib/assets/songs/